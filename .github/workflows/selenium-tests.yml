name: Selenium Python Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  test:
    name: Run ${{ matrix.browser }} tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Chrome
        id: setup-chrome
        if: matrix.browser == 'chrome'
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Set up Firefox
        if: matrix.browser == 'firefox'
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show browser versions
        run: |
          chrome --version || true
          google-chrome --version || true
          firefox --version || true

      - name: Run Selenium tests
        env:
          CHROME_BINARY: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          pytest --browser=${{ matrix.browser }} --headless --html=reports/${{ matrix.browser }}-report.html --self-contained-html

      - name: Upload test report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-${{ matrix.browser }}-artifacts
          path: |
            reports/
            screenshots/
