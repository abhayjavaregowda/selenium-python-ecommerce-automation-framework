[pytest]
pythonpath = .
testpaths =
    tests
    bdd/steps
addopts = -ra --strict-markers --html=reports/report.html --self-contained-html
markers =
    smoke: critical tests that verify the main user journey
    sanity: quick tests that confirm a build is stable enough for deeper testing
    regression: full functional regression coverage
    login: login-related tests
    products: product listing tests
    cart: cart-related tests
    checkout: checkout flow tests
    bdd: behavior-driven scenarios written in Gherkin
    positive: happy-path validation
    negative: negative validation
